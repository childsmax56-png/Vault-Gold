<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>VAULTgold — Moved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050505;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    img.logo {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      opacity: 0.6;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #aaa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 2rem;
      max-width: 420px;
      line-height: 1.6;
    }

    a.btn {
      display: inline-block;
      background: #FFD700;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    a.btn:hover {
      opacity: 0.85;
    }

    .domain {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #444;
    }
  </style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="VAULTgold logo" />
  <h1>We've moved</h1>
  <p>We are no longer using this domain. Head to our new home to keep listening.</p>
  <a class="btn" href="https://unvaulted.cc/">Go to unvaulted.cc</a>
  <p class="domain">unvaulted.cc</p>
</body>
</html>
