<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>VAULTgold</title>
  <meta property="og:title" content="VAULTgold" />
  <meta property="og:description" content="The Best Music Trackers In The World" />
  <meta property="og:image" content="https://i.ibb.co/DHm1MFQZ/VLTG-01.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050505;
      --card-bg: #0f0f0f;
      --card-border: rgba(255,255,255,0.06);
      --gold: #C9A224;
      --gold-dim: rgba(201,162,36,0.15);
      --white: #ffffff;
      --muted: rgba(255,255,255,0.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 64px 24px 48px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 64px;
    }

    .header img {
      width: clamp(220px, 40vw, 380px);
      height: auto;
    }

    .header p {
      margin-top: 20px;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; max-width: 360px; }
    }

    /* Card */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 28px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--white);
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      min-height: 180px;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 0% 100%, var(--gold-dim), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: inherit;
    }

    .card:hover {
      border-color: rgba(201, 162, 36, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,162,36,0.1);
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Big background letter */
    .card-letter {
      position: absolute;
      right: -8px;
      bottom: -16px;
      font-size: 120px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: rgba(255,255,255,0.025);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      transition: color 0.2s ease;
    }

    .card:hover .card-letter {
      color: rgba(201,162,36,0.06);
    }

    .card-top {
      position: relative;
      z-index: 1;
    }

    .card-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,162,36,0.1);
      border: 1px solid rgba(201,162,36,0.2);
      border-radius: 4px;
      padding: 3px 8px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .card-title span {
      color: var(--gold);
    }

    .card-logo {
      display: block;
      height: 56px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      object-position: left center;
      transition: filter 0.2s ease;
    }

    .card-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
    }

    .card-artist {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover .card-arrow {
      border-color: var(--gold);
      background: rgba(201,162,36,0.1);
    }

    .card-arrow svg {
      width: 12px;
      height: 12px;
      stroke: var(--muted);
      transition: stroke 0.2s, transform 0.2s;
    }

    .card:hover .card-arrow svg {
      stroke: var(--gold);
      transform: translate(1px, -1px);
    }

    /* Footer */
    .footer {
      margin-top: 56px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
