  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050505;
      --card-bg: #0f0f0f;
      --card-border: rgba(255,255,255,0.06);
      --gold: #C9A224;
      --gold-dim: rgba(201,162,36,0.15);
      --white: #ffffff;
      --muted: rgba(255,255,255,0.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      padding: 16px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: scroll;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 64px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header img {
      height: clamp(180px, 28vw, 300px);
      width: auto;
      transform: translateX(-50px);
    }

    .header p {
      margin-top: 20px;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; max-width: 360px; }
    }

    /* Card */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 28px 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--white);
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      min-height: 180px;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 0% 100%, var(--gold-dim), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: inherit;
    }

    .card:hover {
      border-color: rgba(201, 162, 36, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,162,36,0.1);
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Big background letter */
    .card-letter {
      position: absolute;
      right: -8px;
      bottom: -16px;
      font-size: 120px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: rgba(255,255,255,0.025);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      transition: color 0.2s ease;
    }

    .card:hover .card-letter {
      color: rgba(201,162,36,0.06);
    }

    .card-top {
      position: relative;
      z-index: 1;
    }

    .card-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,162,36,0.1);
      border: 1px solid rgba(201,162,36,0.2);
      border-radius: 4px;
      padding: 3px 8px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .card-title span {
      color: var(--gold);
    }

    .card-logo {
      display: block;
      height: 50px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      object-position: left center;
      transition: filter 0.2s ease;
    }

    .card-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
    }

    .card-artist {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .card-arrow {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover .card-arrow {
      border-color: var(--gold);
      background: rgba(201,162,36,0.1);
    }

    .card-arrow svg {
      width: 12px;
      height: 12px;
      stroke: var(--muted);
      transition: stroke 0.2s, transform 0.2s;
    }

    .card:hover .card-arrow svg {
      stroke: var(--gold);
      transform: translate(1px, -1px);
    }

    /* Red card variant */
    .card-red {
      --card-accent: #e53e3e;
      --card-accent-dim: rgba(229,62,62,0.12);
    }

    .card-red::before {
      background: radial-gradient(ellipse at 0% 100%, var(--card-accent-dim), transparent 70%);
    }

    .card-red:hover {
      border-color: rgba(229,62,62,0.45);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(229,62,62,0.12);
    }

    .card-red .card-tag {
      color: var(--card-accent);
      background: rgba(229,62,62,0.1);
      border-color: rgba(229,62,62,0.2);
    }

    .card-red .card-title span {
      color: var(--card-accent);
    }

    .card-red:hover .card-arrow {
      border-color: var(--card-accent);
      background: rgba(229,62,62,0.1);
    }

    .card-red:hover .card-arrow svg {
      stroke: var(--card-accent);
    }

    .card-red:hover .card-letter {
      color: rgba(229,62,62,0.06);
    }

    /* Footer */
    .footer {
      margin-top: 56px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var stateParam = params.get('state');
      if (!code || !stateParam) return;

      window.history.replaceState({}, '', window.location.pathname);

      var parsed;
      try { parsed = JSON.parse(atob(stateParam)); } catch (e) { return; }

      var codeVerifier = parsed.v;
      var returnTo = parsed.r;
      if (!codeVerifier || !returnTo) return;

      var ALLOWED = [
        'https://yzy-gold.childsmax56.workers.dev',
        'https://vamp-gold.childsmax56.workers.dev',
        'https://kdot-gold.childsmax56.workers.dev',
        'https://drizzy-gold.childsmax56.workers.dev',
        'https://yzyarchives.org',
        'http://127.0.0.1:5173',
        'http://localhost:5173',
      ];
      if (!ALLOWED.includes(returnTo)) return;

      fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: 'https://vaultgold.net/',
          client_id: 'c9bdd79bf657487d8973f4c1510523ea',
          code_verifier: codeVerifier,
        }),
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.access_token) return;
          var hash = new URLSearchParams({
            spotify_access_token: data.access_token,
            spotify_refresh_token: data.refresh_token || '',
            spotify_expires_in: String(data.expires_in || 3600),
          });
          window.location.href = returnTo + '/#' + hash.toString();
        })
        .catch(function () {});
    })();
